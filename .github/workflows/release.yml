name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  smoke-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run videotranslate --help
      - run: uv run python -c "from video_translator.media import ensure_ffmpeg, _ffmpeg; ensure_ffmpeg(); print(_ffmpeg())"

  release:
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build download zip (all platforms, launchers included)
        run: |
          git archive --format=zip --prefix="Video-Translator/" \
            -o "Video-Translator-${GITHUB_REF_NAME}.zip" HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Video-Translator-*.zip
          generate_release_notes: true
          body: |
            Download the zip, unpack it, then:
            - **Windows:** double-click `Start Video Translator.bat`
            - **macOS:** right-click `Start Video Translator.command` → Open (first time only)
            - **Linux:** run `./start-video-translator.sh`

            First launch installs everything automatically (needs internet); after that it starts in seconds.
