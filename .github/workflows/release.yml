name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  smoke-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
      - run: uv sync
      - run: uv run pytest -q
      - run: uv run voxdub --version
      - run: uv run voxdub --help
      - run: uv run python -c "from video_translator.media import ensure_ffmpeg, _ffmpeg; ensure_ffmpeg(); print(_ffmpeg())"

      - name: Tag must match the packaged version
        shell: bash
        run: |
          set -eu
          packaged=$(uv run python -c "import video_translator; print(video_translator.__version__)")
          if [ "v$packaged" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match __version__ $packaged" >&2
            exit 1
          fi

  release:
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build download zip (all platforms, launchers included)
        run: |
          git archive --format=zip --prefix="VoxDub/" \
            -o "VoxDub-${GITHUB_REF_NAME}.zip" HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: VoxDub-*.zip
          generate_release_notes: true
          body: |
            Download the zip, unpack it, then:
            - **Windows:** double-click `Start VoxDub.bat`
            - **macOS:** right-click `Start VoxDub.command` → Open (first time only)
            - **Linux:** run `./start-voxdub.sh`

            First launch installs everything automatically (needs internet); after that it starts in seconds.
