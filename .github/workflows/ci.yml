name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
      - run: uv sync
      - name: Unit tests
        run: uv run pytest -q

  smoke-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Install dependencies
        run: uv sync

      - name: Import check
        run: uv run python -c "import video_translator.pipeline, app"

      - name: CLI runs
        run: uv run voxdub --help

      - name: Version flag works
        run: uv run voxdub --version

      - name: ffmpeg auto-download works
        run: uv run python -c "from video_translator.media import ensure_ffmpeg, _ffmpeg; ensure_ffmpeg(); print(_ffmpeg())"

  e2e-offline:
    # Exercises the real pipeline end to end without touching any network
    # service: en -> en short-circuits translation and --no-dub skips TTS.
    # This must always pass, so it gates the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
      - run: uv sync

      - name: Write a transcript
        run: printf '1\n00:00:00,000 --> 00:00:02,000\nHello there.\n\n2\n00:00:02,000 --> 00:00:04,000\nThis is a test.\n' > in.srt

      - name: Generate every subtitle format from it
        run: uv run voxdub --no-dub --from-subs in.srt --to en --from en --subtitles srt,vtt,ass,txt

      - name: Check the outputs are real
        run: |
          set -eux
          for ext in srt vtt ass txt; do
            test -s "in_en.$ext"
            grep -q "This is a test." "in_en.$ext"
          done
          grep -q "00:00:02,000 --> 00:00:04,000" in_en.srt
          grep -q "^WEBVTT" in_en.vtt
          grep -q "^\[Script Info\]" in_en.ass

      - name: Bilingual subtitles
        run: |
          set -eux
          uv run voxdub --no-dub --from-subs in.srt --to en --from en \
            --subtitles srt --subtitle-content both
          test -s in_en.srt

  e2e-live:
    # Actually dubs a clip, so it hits Google Translate and the Edge TTS
    # endpoint. Both are unofficial and can break without notice, so a failure
    # here is information, not a broken build: it must not gate a release.
    # If this goes red, the free endpoints have changed.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
      - run: uv sync

      - name: Build a 4-second test video
        run: |
          set -eux
          ffmpeg -y -f lavfi -i testsrc=size=320x240:rate=15:duration=4 \
                    -f lavfi -i anullsrc=r=24000:cl=mono -t 4 \
                    -c:v libx264 -pix_fmt yuv420p -c:a aac clip.mp4
          printf '1\n00:00:00,000 --> 00:00:02,000\nHello there.\n\n2\n00:00:02,000 --> 00:00:04,000\nThis is a test.\n' > in.srt

      - name: Dub into Hindi (hits Google Translate + Edge TTS)
        run: uv run voxdub clip.mp4 --to hi --from en --from-subs in.srt --srt

      - name: Check the dub produced real audio
        run: |
          set -eux
          test -s clip_hi.mp4
          test -s clip_hi.srt
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_type \
            -of csv=p=0 clip_hi.mp4 | grep -q audio
          # volumedetect reports at info level, so this must not be quietened
          ffmpeg -hide_banner -i clip_hi.mp4 -af volumedetect -f null - 2> vol.txt || true
          cat vol.txt
          uv run python .github/scripts/assert_not_silent.py vol.txt
