name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Import check
        run: uv run python -c "import video_translator.pipeline, app"

      - name: CLI runs
        run: uv run videotranslate --help

      - name: ffmpeg auto-download works
        run: uv run python -c "from video_translator.media import ensure_ffmpeg, _ffmpeg; ensure_ffmpeg(); print(_ffmpeg())"
