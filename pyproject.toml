[project]
name = "voxdub"
version = "1.0.0"
description = "VoxDub — dub any video into another language: local Whisper STT + free neural TTS"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Ganesh" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    "faster-whisper>=1.0",
    "deep-translator>=1.11",
    "edge-tts>=6.1",
    "pydub>=0.25",
    "gradio>=4.44",
    "static-ffmpeg>=3.0",
]

[project.urls]
Homepage = "https://github.com/devganeshg/voxdub"
Repository = "https://github.com/devganeshg/voxdub"
Issues = "https://github.com/devganeshg/voxdub/issues"

[project.scripts]
voxdub = "video_translator.cli:main"
videotranslate = "video_translator.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["video_translator"]
