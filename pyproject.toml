[project]
name = "video-translator"
version = "0.1.0"
description = "Translate a video's voice into another language: local Whisper STT + free neural TTS"
requires-python = ">=3.11,<3.13"
dependencies = [
    "faster-whisper>=1.0",
    "deep-translator>=1.11",
    "edge-tts>=6.1",
    "pydub>=0.25",
    "gradio>=4.44",
    "static-ffmpeg>=3.0",
]

[project.scripts]
videotranslate = "video_translator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["video_translator"]
