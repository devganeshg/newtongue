[project]
name = "newtongue"
version = "1.0.0"
description = "Newtongue — dub any video into another language: local Whisper STT + free neural TTS"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Ganesh" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    "faster-whisper>=1.0",
    "deep-translator>=1.11",
    "edge-tts>=6.1",
    "pydub>=0.25",
    # 6.0 moved theme/css from the Blocks constructor to launch(), which is
    # where app.py passes them; on 4.x/5.x they would be silently ignored.
    "gradio>=6.0,<7",
    "static-ffmpeg>=3.0",
]

[project.urls]
Homepage = "https://github.com/devganeshg/newtongue"
Repository = "https://github.com/devganeshg/newtongue"
Issues = "https://github.com/devganeshg/newtongue/issues"

[project.scripts]
newtongue = "newtongue.cli:main"
nt = "newtongue.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["newtongue"]
